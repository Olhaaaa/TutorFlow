{{/*
Шина подій мікросервісів — свій Redis у своєму namespace. Спільний із монолітом
не можна: обидві версії пишуть у стрім із тим самим ім'ям tutorflow.events,
і події однієї потрапили б до споживачів іншої.
Ім'я Service — redis, як у compose: REDIS_URL=redis://redis:6379.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "ms.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "ms.selector" (dict "ctx" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ms.labels" (dict "ctx" . "component" "redis") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "ms.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "ms.selector" (dict "ctx" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
