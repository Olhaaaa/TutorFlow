apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "tutorflow.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tutorflow.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tutorflow.labels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        # Зміна ConfigMap сама по собі под не перезапускає — а хеш у шаблоні так.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "tutorflow.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "tutorflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "services/api/dist/main.js"]
          ports:
            - name: http
              containerPort: 8080
          {{- include "tutorflow.envFrom" . | nindent 10 }}
          # /healthz поза префіксом /api. З нього ж GKE бере перевірку здоров'я
          # балансувальника (див. BackendConfig у ingress.yaml).
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "tutorflow.labels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    # Container-native балансування: LB ходить прямо в поди, без проміжного
    # хопу через NodePort.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "{{ .Release.Name }}-api"}'
spec:
  type: ClusterIP
  selector:
    {{- include "tutorflow.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "tutorflow.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
