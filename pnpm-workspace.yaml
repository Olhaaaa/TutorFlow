packages:
  - 'packages/*'
  - 'services/*'
  - 'apps/*'

# Явне рішення щодо кожного build-скрипта. Без цього pnpm 12 падає з
# ERR_PNPM_IGNORED_BUILDS у неінтерактивному оточенні, наприклад у Docker.
allowBuilds:
  esbuild: true          # потрібен vitest
  '@scarf/scarf': false  # телеметрія, свідомо не запускаємо
